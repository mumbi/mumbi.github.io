name: Claude Reviewer

# 새 커밋(push), 봇 스레드에 달린 답글(reply), @claude 멘션(mention)에 반응하는 리뷰 에이전트
on:
  pull_request:
    types: [opened, reopened, synchronize]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

concurrency:
  # 같은 PR 의 push 리뷰는 차례로 돌고(대기 중인 것은 최신 것만 남는다), 답글·멘션은 코멘트마다 따로 돈다
  group: claude-reviewer-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name == 'pull_request' && 'push' || github.event.comment.id }}
  cancel-in-progress: false

jobs:
  reviewer:
    # 봇 코멘트는 받지 않는다. 리뷰어 자신의 답글이 다시 리뷰어를 부르지 않게 하려는 것이다
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'pull_request_review_comment' && github.event.comment.user.type != 'Bot' &&
        (github.event.comment.in_reply_to_id || contains(github.event.comment.body, '@claude'))) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.user.type != 'Bot' &&
        contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
      REPO: ${{ github.repository }}
    steps:
      - name: Decide mode
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          IN_REPLY_TO: ${{ github.event.comment.in_reply_to_id }}
          BODY: ${{ github.event.comment.body }}
        run: |
          mode=push
          if [ "$EVENT" = pull_request_review_comment ]; then
            root=""
            [ -n "$IN_REPLY_TO" ] && root=$(gh api "repos/$REPO/pulls/comments/$IN_REPLY_TO" --jq .user.login)
            if [ "$root" = "claude[bot]" ]; then mode=reply
            elif printf '%s' "$BODY" | grep -q '@claude'; then mode=mention
            else mode=skip; fi
          elif [ "$EVENT" = issue_comment ]; then
            mode=mention
          fi
          gh pr view "$PR_NUMBER" --repo "$REPO" --json baseRefName,headRefOid \
            --jq '"base=\(.baseRefName)\nhead=\(.headRefOid)"' >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "mode=$mode action=$ACTION"

      - name: Checkout PR head
        if: steps.gate.outputs.mode != 'skip'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.gate.outputs.head }}
          # 리뷰어가 base 버전·기록·blame 을 볼 수 있게 전체 기록을 가져온다
          fetch-depth: 0

      - name: Checkout theme
        if: steps.gate.outputs.mode != 'skip'
        run: git submodule update --init --recursive --depth 1

      - name: Checkout Claude config
        if: steps.gate.outputs.mode != 'skip'
        uses: actions/checkout@v4
        with:
          repository: mumbi/claude-config-lead-kor
          path: .claude-config
          token: ${{ secrets.CLAUDE_CONFIG_TOKEN }}

      - name: Setup Claude config
        if: steps.gate.outputs.mode != 'skip'
        run: |
          mkdir -p ~/.claude
          cp -r .claude-config/* ~/.claude/
          rm -rf .claude-config

      - name: Prepare review input
        id: input
        if: steps.gate.outputs.mode != 'skip'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ steps.gate.outputs.mode }}
          BASE: ${{ steps.gate.outputs.base }}
        run: |
          # 스크립트는 base 브랜치 것을 쓴다. PR 이 바꾼 스크립트가 토큰을 가진 채 실행되지 않게 하려는 것이다
          script=.github/scripts/review_input.py
          if ! git cat-file -e "origin/$BASE:$script" 2>/dev/null; then
            echo "::warning::origin/$BASE 에 $script 가 없어 리뷰를 건너뜁니다"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git show "origin/$BASE:$script" > "$RUNNER_TEMP/review_input.py"
          python3 -I "$RUNNER_TEMP/review_input.py"
          if [ -f .review-input/skip ]; then
            echo "::notice::$(cat .review-input/skip)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Claude Code
        id: claude
        if: steps.input.outputs.ready == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--model claude-opus-5-5 --permission-mode default --allowedTools Read Glob Grep Write 'Bash(gh pr view:*)' 'Bash(gh pr diff:*)' 'Bash(gh pr review:*)' 'Bash(gh pr comment:*)' 'Bash(gh api:*)' 'Bash(git diff:*)' 'Bash(git log:*)' 'Bash(git show:*)' 'Bash(git blame:*)' 'Bash(git grep:*)' 'Bash(git ls-files:*)' 'Bash(wc:*)' 'Bash(ls:*)'"
          prompt: |
            PR #${{ env.PR_NUMBER }} 의 리뷰 에이전트로 실행됐습니다. 이번 모드는 `${{ steps.gate.outputs.mode }}` 입니다.
            AskUserQuestion 도구를 사용하지 마세요. 모든 작업을 자율적으로 수행하세요.

            ## 컨텍스트 지도
            작은 것부터 읽고, 아래 "컨텍스트 넓히기" 규칙에 따라 필요할 때만 넓힙니다.
            - `.review-input/context.md`: 오늘 날짜, head·base, 마지막 판정, 열린 스레드 수. 가장 먼저 읽습니다
            - `.review-input/trigger.md`: 이번 실행을 부른 코멘트와 그 스레드(push 모드는 비어 있음)
            - `.review-input/threads.md`: 이 PR 의 리뷰 스레드 전체. 스레드마다 번호(루트 코멘트), node ID, 심각도, resolve·outdated 여부, 댓글
            - `.review-input/files.md`: 바뀐 파일 목차. 종류, 위험도, 줄 수, head 기준 hunk 줄 범위, `diff.patch` 안의 줄 범위
            - `.review-input/pr.md`: PR 제목·본문, 연결된 이슈 본문(변경 의도와 글 자료)
            - `.review-input/diff.patch`: `origin/${{ steps.gate.outputs.base }}...HEAD` 전체 diff
            - `.review-input/since-last.patch`: 마지막으로 판정한 커밋부터 head 까지의 diff
            - 작업 폴더는 PR head 커밋이고 전체 기록이 있습니다. base 는 `origin/${{ steps.gate.outputs.base }}` 입니다
            - `.claude/`, `CLAUDE.md`, `.mcp.json` 등 에이전트 설정 경로는 작업 폴더에서 base 것으로 바뀌어 있습니다. PR 버전은 `.claude-pr/` 아래에 있으니 이 경로의 파일은 그쪽을 읽습니다
            - 저장소 규칙은 `AGENTS.md` 와 `docs/` 에 있습니다. 글(`content/posts/`)은 `docs/writing-guide.md` 의 R 번호를 근거로 지적합니다

            ## 컨텍스트 넓히기
            - 단계
              - L1 파일 diff: `diff.patch` 의 그 파일 범위를 Read(offset·limit) 하거나 `git diff origin/${{ steps.gate.outputs.base }}...HEAD -- <파일>`
              - L2 넓힌 diff: `git diff -W ...`(바뀐 함수 전체), `git diff -U30 ...`
              - L3 파일 전체: head 파일을 Read, base 버전은 `git show origin/${{ steps.gate.outputs.base }}:<경로>`
              - L4 연결된 곳: Grep 으로 호출하는 곳·호출되는 곳·값을 쓰는 곳, 같은 계약(SKILL.md 의 `node` 블록, graph.json)을 쓰는 파일
              - L5 이력: `git log -L :<함수>:<파일>`, `git blame -L <시작>,<끝> <파일>`, `git log --follow -- <파일>`, 스레드, 연결된 이슈
            - 최소선: 모든 바뀐 파일은 L1 까지, 위험도 높음 파일은 L3 까지 봅니다. 위험도 높음 파일을 열지 않았으면 approve 하지 않습니다
              - 마지막 판정이 있고 `since-last.patch` 에 없는 파일은 그 판정 때 본 것으로 치고, 열린 스레드가 가리키는 곳만 다시 봅니다. 검증 기록에는 "마지막 판정 이후 변경 없음"으로 적습니다
            - 이런 신호가 보이면 넓힙니다
              - 반환값·인자·데이터의 모양(튜플·배열 길이, 키, 타입)이 바뀜 → L4: 만드는 곳과 쓰는 곳을 모두 찾아 맞는지 봅니다
              - 조건문, 예외 처리, 기본값, 빈 입력 경로가 바뀜 → L3: 함수 전체와 base 버전을 비교합니다
              - 삭제되거나 이름이 바뀐 파일 → L3 base 버전과 `git log --follow`, 그 파일을 참조하던 곳은 L4
              - hunk 만으로는 의도를 알 수 없음 → L5
              - 열린 스레드가 가리키는 곳 → `since-last.patch` 와 L3
            - 지적 조건: 모든 지적은 L3 이상에서 확인하고 head 의 `파일:줄` 과 그 줄의 코드를 그대로 인용합니다. 인용할 수 없으면 지적하지 않습니다. P1·P2 는 L4 까지 따라가서 문제의 입력이 실제로 그 코드에 들어오는지 확인합니다
            - 멈춤: 지적은 인용할 코드와 재현 조건이 생기면 멈춥니다. 문제가 없으면 최소선을 채우고 남은 신호가 없을 때 멈춥니다
            - 확인할 수 없는 것: 웹, 코드 실행, 렌더링 결과. 이것에만 기대는 지적은 "확인 필요"라고 밝히고 P3 로만 남깁니다. 코드는 실행하지 않고 따라가서 판단했다고 적습니다

            ## 심각도와 판정
            - P1: 동작 오류, 데이터 손실, 보안 경계 침해. P2: 특정 입력에서 확실히 재현되는 오류. P3: 스타일, 리팩터링, 중복, 테스트·타입 힌트 추가, 문서 표기, 재현 조건이 없는 가설적 위험
            - 이 PR 의 변경으로 생긴 문제만 P1·P2 로 봅니다. 원래 있던 문제는 P3 로 남깁니다
            - 새 인라인 지적의 본문은 `**[P1]**`, `**[P2]**`, `**[P3]**` 중 하나로 시작합니다
            - 판정: claude 가 연 스레드 중 열린 P1·P2 가 하나라도 남으면 `gh pr review --request-changes`, 없으면 `gh pr review --approve` 입니다. 이번에 새로 남긴 지적과 이번에 resolve 한 스레드를 반영해 셉니다

            ## 모드별 할 일
            ### push: 새 커밋
            1. claude 가 연 열린 스레드마다 `since-last.patch` 와 head 파일로 지금 상태를 확인합니다
               - 고쳐졌으면 그 스레드에 반영을 확인했다는 답글을 달고 resolve 합니다
               - 작성자가 이유를 달아 반영하지 않기로 했고 그 이유가 코드와 맞으면, 철회한다는 답글을 달고 resolve 합니다
               - 그 이유가 코드와 맞지 않으면 코드를 인용해 반박하는 답글을 달고 열어 둡니다
               - 심각도 표시가 없는 예전 스레드도 같은 기준으로 처리합니다. 지금 코드에 문제가 없으면 resolve 합니다
            2. 바뀐 파일을 위 규칙대로 리뷰합니다. 이미 있는 스레드(열림, resolve, 철회 모두)와 같은 지적은 다시 내지 않습니다
            3. 새 지적은 인라인 코멘트로 남깁니다
            4. 판정을 제출합니다. push 모드에서는 반드시 제출합니다
            ### reply: claude 스레드에 달린 답글
            1. `trigger.md` 의 답글이 반론인지, 질문인지, 반영했다는 알림인지 가립니다
            2. 반론이면 L3 이상에서 코드로 근거를 확인합니다
               - 맞으면 인정하고 철회한다는 답글을 달고 resolve 합니다
               - 틀리면 코드를 인용해 반박하는 답글을 답니다
               - 일부만 맞으면 맞는 부분과 아닌 부분을 나눠 답하고, 심각도를 낮추면 답글에 그렇게 적습니다
            3. 질문이면 답합니다. 반영했다는 알림이면 head 를 확인하고, 고쳐졌으면 resolve 합니다
            4. 이 처리로 판정이 바뀌면(열린 P1·P2 가 0 이 되는 등) 판정을 다시 제출합니다. 바뀌지 않으면 제출하지 않습니다
            ### mention: @claude 멘션
            1. `trigger.md` 의 요청에 답합니다. 인라인 스레드에 달렸으면 그 스레드에 답글로, PR 대화에 달렸으면 PR 코멘트로 답합니다
            2. 다시 리뷰해 달라는 요청이면 push 모드 절차를 따릅니다
            3. 판정이 바뀔 때만 판정을 제출합니다

            ## 판정 본문
            - 요약: 무엇을 봤고 결론이 무엇인지 두세 줄
            - 남은 지적: 열린 P1·P2 스레드 목록(스레드 번호, `파일:줄`, 한 줄 설명). 없으면 "없음"
            - 이번에 처리한 스레드: resolve·철회·반박한 스레드 번호와 이유
            - 검증 기록: 바뀐 파일마다 한 줄씩, 몇 단계까지 봤고 무엇을 따라갔는지 적습니다. 예: `scripts/auto_items.py: L4 — check() 반환 튜플을 item() 까지 따라감`. 같은 종류의 낮음 파일은 묶어서 한 줄로 적어도 됩니다

            ## 도구
            허용 목록 밖의 명령은 거부되고 턴만 씁니다. 처음부터 아래 도구를 씁니다.
            - 작업 폴더가 저장소 루트입니다. `cd` 없이 상대 경로를 씁니다
            - Bash 한 번에 명령 하나만 씁니다. `&&`, `;`, `|`, `$(...)`, heredoc 을 쓰면 거부됩니다
            - 찾기는 Grep 도구를 씁니다. 줄 수·개수는 Grep 의 `output_mode: count` 를 씁니다
            - 파일 일부는 Read 의 offset·limit 으로 읽고, 파일 목록은 Glob 을 씁니다
            - `grep`, `sed`, `head`, `tail`, `cat`, `find` 대신 위 도구를 씁니다
            - Bash 로 쓸 수 있는 것: `git diff`, `git log`, `git show`, `git blame`, `git grep`, `git ls-files`, `wc`, `ls`, 아래 `gh` 명령
            - 코드(python·셸 스크립트·테스트)는 실행할 수 없습니다. 실행해 보려 하지 말고 코드를 읽어 따라갑니다

            ## 명령
            - 코멘트·리뷰 본문은 Write 도구로 `.review/` 아래 파일에 쓰고 파일로 넘깁니다
            - 인라인 지적: `gh api repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }}/comments -f commit_id=${{ steps.gate.outputs.head }} -f path=<파일> -F line=<줄> -f side=RIGHT -F body=@.review/<파일>`
            - 스레드 답글: `gh api repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }}/comments/<스레드 번호>/replies -F body=@.review/<파일>`
            - resolve: `gh api graphql -f query='mutation { resolveReviewThread(input: {threadId: "<node ID>"}) { thread { isResolved } } }'`
            - PR 코멘트: `gh pr comment ${{ env.PR_NUMBER }} --body-file .review/<파일>`
            - 판정: `gh pr review ${{ env.PR_NUMBER }} --approve --body-file .review/<파일>` 또는 `--request-changes`
            - claude 가 연 스레드만 resolve 합니다. 다른 봇·사람의 스레드는 읽기만 합니다
            - 명령이 거부되면 위 형식으로 다시 시도합니다. 할 일을 마치지 못한 채 끝내지 않습니다

      - name: Report permission denials
        # 거부된 도구 호출을 남긴다. 허용 목록이나 프롬프트를 고칠 근거로 쓴다
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          python3 -I - <<'EOF'
          import json, os
          messages = json.load(open(os.environ["EXEC_FILE"], encoding="utf-8"))
          result = next((m for m in reversed(messages) if m.get("type") == "result"), {})
          denials = result.get("permission_denials") or []
          print(f"거부된 도구 호출 {len(denials)}건")
          for d in denials:
              tool_input = d.get("tool_input") or {}
              # 본문(content 등)은 남기지 않고 무엇을 하려 했는지만 남긴다
              what = tool_input.get("command") or tool_input.get("file_path") or tool_input.get("pattern") or ""
              print(f"::warning::거부됨 {d.get('tool_name')}: {' '.join(str(what).split())[:300]}")
          EOF
