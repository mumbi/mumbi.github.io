name: Claude Reviewer

on:
  pull_request:
    types: [opened, reopened, synchronize]
  pull_request_review_comment:
    types: [created]

jobs:
  reviewer:
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Checkout Claude config
        uses: actions/checkout@v4
        with:
          repository: mumbi/claude-config-lead-kor
          path: .claude-config
          token: ${{ secrets.CLAUDE_CONFIG_TOKEN }}

      - name: Setup Claude config
        run: |
          mkdir -p ~/.claude
          cp -r .claude-config/* ~/.claude/
          rm -rf .claude-config

      - name: Setup git identity
        run: |
          git config user.name "claude-reviewer"
          git config user.email "claude-reviewer@noreply.github.com"

      - name: Fetch PR info and diff
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          PR_INFO=$(gh pr view "$PR_NUMBER" --json title,body,headRefName,baseRefName,changedFiles,additions,deletions)
          PR_DIFF=$(gh pr diff "$PR_NUMBER")
          # 봇이 연 인라인 스레드와 그 답글(최근 100개 코멘트). 같은 지적을 되풀이하지 않게 리뷰어에게 보여 준다
          THREADS=$(gh api "repos/$REPO/pulls/$PR_NUMBER/comments?per_page=100" --jq '
            group_by(.in_reply_to_id // .id) | map(sort_by(.created_at))
            | map(select(.[0].user.login | endswith("[bot]")))
            | .[] | "### 스레드 \(.[0].id) — \(.[0].path):\(.[0].line // .[0].original_line // "-")",
                    (.[] | "- \(.user.login): \(.body | gsub("\\s+"; " ") | .[0:600])"), ""')
          {
            echo "PR_INFO<<ENDOFPRINFO"
            echo "$PR_INFO"
            echo "ENDOFPRINFO"
            echo "PR_DIFF<<ENDOFDIFF"
            echo "$PR_DIFF"
            echo "ENDOFDIFF"
            echo "THREADS<<ENDOFTHREADS"
            echo "${THREADS:-(없음)}"
            echo "ENDOFTHREADS"
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--model claude-opus-5-5 --permission-mode default --allowedTools Read Glob Grep Write 'Bash(gh pr:*)' 'Bash(gh api:*)' 'Bash(git diff:*)' 'Bash(git log:*)'"
          prompt: |
            PR #${{ github.event.pull_request.number }} 을 리뷰해주세요.
            AskUserQuestion 도구를 사용하지 마세요. 모든 작업을 자율적으로 수행하세요.

            ## PR 정보
            ${{ steps.pr.outputs.PR_INFO }}

            ## 변경 내용 (diff)
            ${{ steps.pr.outputs.PR_DIFF }}

            ## 기존 리뷰 스레드
            ${{ steps.pr.outputs.THREADS }}

            ## 이번 실행을 부른 코멘트
            스레드 ${{ github.event.comment.in_reply_to_id || github.event.comment.id }}: ${{ github.event.comment.body }}
            (비어 있으면 새 커밋으로 시작된 리뷰입니다)

            ## 리뷰 지침
            - 위 diff를 분석하여 코드 품질, 보안, 성능 문제를 점검합니다
            - `.claude/`, `CLAUDE.md`, `.mcp.json` 등 에이전트 설정 경로는 작업 폴더에서 기본 브랜치 것으로 바뀌어 있습니다. 이 경로의 PR 버전은 `.claude-pr/` 아래에 있으니, 파일을 열어 확인할 때는 그쪽을 읽습니다
            - 지적은 PR head 의 파일을 열어 확인한 것만 남깁니다. 지적마다 `파일:줄` 과 그 줄의 코드를 그대로 인용하고, 인용할 수 없으면 지적하지 않습니다
            - 기존 리뷰 스레드에서 이미 반영됐거나, 작성자가 이유를 달아 반영하지 않기로 한 지적은 다시 내지 않습니다. 그 이유가 코드와 맞지 않을 때만, 그 스레드에 답글로 코드 인용과 함께 반박합니다
            - 이번 실행을 부른 코멘트가 있으면 먼저 그 스레드에 답글로 응답합니다(받아들이는지, 아니면 근거를 들어 반박하는지). 답글은 `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments/<스레드 번호>/replies -F body=@.review/<파일>` 로 남깁니다
            - 전체 요약은 gh pr comment 명령으로 PR 코멘트로 한 번만 남깁니다
            - 구체적인 지적사항은 해당 파일/라인에 인라인 리뷰 코멘트로 남깁니다
            - 판정 기준:
              - `gh pr review --request-changes` 는 이 PR 의 변경으로 생기는 P1(동작 오류·데이터 손실·보안 경계 침해) 또는 P2(특정 입력에서 확실히 재현되는 오류)가 하나라도 남아 있을 때만 씁니다
              - P3(스타일, 리팩터링, 중복, 테스트·타입 힌트 추가, 문서 표기, 재현 조건이 없는 가설적 위험)만 있으면 인라인 코멘트로 남기고 `gh pr review --approve` 로 제출합니다
              - 지적이 없으면 `gh pr review --approve` 로 제출합니다
            - 판정 전에 검증합니다. diff 에서 바뀐 실행 코드 파일(`.py`, `.sh`, `.js`, `.ts`, `.go` 등)은 모두 Read 로 열고, 바뀐 함수마다 값의 모양(튜플·배열 길이, 키, 타입)이 만드는 곳과 쓰는 곳에서 맞는지, 예외·빈 입력 경로가 어디로 가는지 따라가 봅니다. 열지 않은 코드 파일이 있으면 approve 하지 않습니다
            - 전체 요약에는 검증한 코드 파일마다 무엇을 따라가 봤는지 한 줄씩 적습니다
            - 코멘트·리뷰 본문은 Write 도구로 `.review/` 아래 파일에 쓰고 `--body-file` 로 넘깁니다. 명령에 `$(...)`, heredoc, 파이프, `&&` 를 쓰면 권한이 거부됩니다
            - 인라인 코멘트는 `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments -f commit_id=${{ github.event.pull_request.head.sha }} -f path=<파일> -F line=<줄> -f side=RIGHT -F body=@.review/<파일>` 로 남깁니다
            - 리뷰를 제출하지 못하고 끝내지 않습니다. 명령이 거부되면 위 방법으로 다시 시도합니다
