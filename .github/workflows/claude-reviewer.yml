name: Claude Reviewer

on:
  pull_request:
    types: [opened, reopened, synchronize]
  pull_request_review_comment:
    types: [created]

jobs:
  reviewer:
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Checkout Claude config
        uses: actions/checkout@v4
        with:
          repository: mumbi/claude-config-lead-kor
          path: .claude-config
          token: ${{ secrets.CLAUDE_CONFIG_TOKEN }}

      - name: Setup Claude config
        run: |
          mkdir -p ~/.claude
          cp -r .claude-config/* ~/.claude/
          rm -rf .claude-config

      - name: Setup git identity
        run: |
          git config user.name "claude-reviewer"
          git config user.email "claude-reviewer@noreply.github.com"

      - name: Fetch PR info and diff
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PR_INFO=$(gh pr view "$PR_NUMBER" --json title,body,headRefName,baseRefName,changedFiles,additions,deletions)
          PR_DIFF=$(gh pr diff "$PR_NUMBER")
          {
            echo "PR_INFO<<ENDOFPRINFO"
            echo "$PR_INFO"
            echo "ENDOFPRINFO"
            echo "PR_DIFF<<ENDOFDIFF"
            echo "$PR_DIFF"
            echo "ENDOFDIFF"
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--model claude-sonnet-4-5-20250929 --allowedTools Read Glob Grep 'Bash(gh pr:*)' 'Bash(gh api:*)' 'Bash(git diff:*)' 'Bash(git log:*)'"
          prompt: |
            PR #${{ github.event.pull_request.number }} 을 리뷰해주세요.
            AskUserQuestion 도구를 사용하지 마세요. 모든 작업을 자율적으로 수행하세요.

            ## PR 정보
            ${{ steps.pr.outputs.PR_INFO }}

            ## 변경 내용 (diff)
            ${{ steps.pr.outputs.PR_DIFF }}

            ## 리뷰 지침
            - 위 diff를 분석하여 코드 품질, 보안, 성능 문제를 점검합니다
            - 전체 요약은 gh pr comment 명령으로 PR 코멘트로 남깁니다
            - 구체적인 지적사항은 해당 파일/라인에 인라인 리뷰 코멘트로 남깁니다
            - 문제가 없으면 gh pr review --approve, 수정이 필요하면 gh pr review --request-changes로 리뷰를 제출합니다
