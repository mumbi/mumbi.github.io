name: Claude Task Worker

on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]

jobs:
  task-worker:
    if: |
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Checkout Claude config
        uses: actions/checkout@v4
        with:
          repository: mumbi/claude-config-lead-kor
          path: .claude-config
          token: ${{ secrets.CLAUDE_CONFIG_TOKEN }}

      - name: Setup Claude config
        run: |
          mkdir -p ~/.claude
          cp -r .claude-config/* ~/.claude/
          rm -rf .claude-config

      - name: Setup git identity
        run: |
          git config user.name "claude-worker"
          git config user.email "claude-worker@noreply.github.com"

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "*"
          claude_args: "--model claude-sonnet-4-5-20250929 --allowedTools Edit Write Read Glob Grep 'Bash(git:*)' 'Bash(gh:*)'"
          prompt: |
            이슈에 기술된 작업을 수행해주세요.
            AskUserQuestion 도구를 사용하지 마세요. 모든 작업을 자율적으로 수행하세요.

            ## 작업 원칙
            - 이슈의 요청을 정확히 수행한다. 임의로 변경하거나 생략하지 않는다.
            - 복수 작업이면 커밋 단위로 분해하여 subagent에게 병렬 위임한다.
            - 파일 수정만 하면 된다. 커밋, 푸시, PR 생성은 워크플로우가 자동으로 처리한다.

      - name: Commit and push changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore: 작업 에이전트 변경사항 커밋"
            git push
            echo "Changes committed and pushed"
          else
            echo "No uncommitted changes"
          fi

      - name: Create PR if branch was pushed
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_CONFIG_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          CURRENT_BRANCH=$(git branch --show-current)
          if [ "$CURRENT_BRANCH" != "master" ] && [ "$CURRENT_BRANCH" != "main" ]; then
            EXISTING_PR=$(gh pr list --head "$CURRENT_BRANCH" --state open --json number --jq '.[0].number')
            if [ -z "$EXISTING_PR" ]; then
              PR_BODY="Closes #${ISSUE_NUMBER}"$'\n\n'"@claude"
              gh pr create \
                --base master \
                --head "$CURRENT_BRANCH" \
                --title "$ISSUE_TITLE" \
                --body "$PR_BODY"
              echo "PR created for branch $CURRENT_BRANCH"
            else
              echo "PR #$EXISTING_PR already exists for branch $CURRENT_BRANCH"
            fi
          else
            echo "Still on master branch — no PR to create"
          fi
