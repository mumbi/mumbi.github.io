name: Claude Feedback Worker

on:
  pull_request_review:
    types: [submitted]

jobs:
  feedback-worker:
    if: github.event.review.state == 'changes_requested'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Checkout Claude config
        uses: actions/checkout@v4
        with:
          repository: mumbi/claude-config-lead-kor
          path: .claude-config
          token: ${{ secrets.CLAUDE_CONFIG_TOKEN }}

      - name: Setup Claude config
        run: |
          mkdir -p ~/.claude
          cp -r .claude-config/* ~/.claude/
          rm -rf .claude-config

      - name: Setup git identity
        run: |
          git config user.name "claude-worker"
          git config user.email "claude-worker@noreply.github.com"

      - name: Fetch review comments
        id: review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          REVIEW_BODY=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/reviews" \
            --jq '[.[] | select(.state == "CHANGES_REQUESTED")] | last | .body')
          REVIEW_COMMENTS=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/comments" \
            --jq '[.[] | {path: .path, line: .line, body: .body}]')
          {
            echo "REVIEW_BODY<<ENDOFREVIEW"
            echo "$REVIEW_BODY"
            echo "ENDOFREVIEW"
            echo "REVIEW_COMMENTS<<ENDOFCOMMENTS"
            echo "$REVIEW_COMMENTS"
            echo "ENDOFCOMMENTS"
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--model claude-opus-5-5 --permission-mode default --allowedTools Edit Write Read Glob Grep 'Bash(git:*)' 'Bash(gh:*)'"
          allowed_bots: "claude[bot]"
          prompt: |
            PR #${{ github.event.pull_request.number }} 에 changes_requested 리뷰가 제출되었습니다.
            AskUserQuestion 도구를 사용하지 마세요. 모든 작업을 자율적으로 수행하세요.

            ## 리뷰 요약
            ${{ steps.review.outputs.REVIEW_BODY }}

            ## 인라인 코멘트
            ${{ steps.review.outputs.REVIEW_COMMENTS }}

            위 리뷰에서 지적된 문제를 모두 수정해주세요.
            파일 수정만 하면 됩니다. 커밋과 푸시는 다음 단계에서 자동으로 처리됩니다.
            `.claude/`, `CLAUDE.md` 등 에이전트 설정 경로는 기본 브랜치 것으로 바뀌어 있어 수정해도 커밋되지 않습니다. 그 경로의 지적은 고치지 말고, 고치지 못한 이유를 PR 코멘트로 남깁니다.

      - name: Commit and push fixes
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_CONFIG_TOKEN }}
        run: |
          # claude-code-action 은 PR head 를 믿지 않아 아래 경로를 기본 브랜치 것으로 바꿔 둔다.
          # 그대로 커밋하면 PR 에만 있는 파일이 지워지므로, PR head 상태로 되돌린 뒤 커밋한다
          for p in .claude .mcp.json .claude.json .gitmodules .ripgreprc CLAUDE.md CLAUDE.local.md .husky; do
            rm -rf "$p"
            if git cat-file -e "HEAD:$p" 2>/dev/null; then git checkout HEAD -- "$p"; fi
          done
          rm -rf .claude-pr
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "리뷰 피드백 반영"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
            git push
            echo "Fixes committed and pushed"
          else
            echo "No changes to commit"
          fi
