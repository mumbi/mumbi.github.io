name: Claude Worker

on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  worker:
    if: |
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && github.event.review.state == 'changes_requested')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Checkout Claude config
        uses: actions/checkout@v4
        with:
          repository: mumbi/claude-config-lead-kor
          path: .claude-config
          token: ${{ secrets.CLAUDE_CONFIG_TOKEN }}

      - name: Setup Claude config
        run: |
          mkdir -p ~/.claude
          cp -r .claude-config/* ~/.claude/
          rm -rf .claude-config

      - name: Setup git identity
        run: |
          git config user.name "claude-worker"
          git config user.email "claude-worker@noreply.github.com"

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--model claude-sonnet-4-5-20250929"
