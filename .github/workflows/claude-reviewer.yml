name: Claude Reviewer

on:
  pull_request:
    types: [opened, reopened, synchronize]
  pull_request_review_comment:
    types: [created]

jobs:
  reviewer:
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Checkout Claude config
        uses: actions/checkout@v4
        with:
          repository: mumbi/claude-config-lead-kor
          path: .claude-config
          token: ${{ secrets.CLAUDE_CONFIG_TOKEN }}

      - name: Setup Claude config
        run: |
          mkdir -p ~/.claude
          cp -r .claude-config/* ~/.claude/
          rm -rf .claude-config

      - name: Setup git identity
        run: |
          git config user.name "claude-reviewer"
          git config user.email "claude-reviewer@noreply.github.com"

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude"
          claude_args: "--model claude-sonnet-4-5-20250929"
